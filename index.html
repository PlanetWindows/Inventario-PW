<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario Planet Windows</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="inventory" src="inventory-full.html" title="Inventario Planet Windows"></iframe>
<script>
(function(){
  const frame=document.getElementById('inventory');
  frame.addEventListener('load',()=>{
    const doc=frame.contentDocument;
    if(!doc)return;
    const clean=()=>{
      doc.querySelectorAll('tr').forEach(row=>{
        const original=row.querySelector('.delete');
        if(original){
          row.querySelectorAll('.pw-del').forEach(btn=>{
            const cell=btn.closest('td');
            if(cell && cell.children.length===1) cell.remove();
            else btn.remove();
          });
        }
      });
    };
    clean();
    new MutationObserver(clean).observe(doc.body,{childList:true,subtree:true});
    setTimeout(clean,250);
    setTimeout(clean,1000);
  });
})();
</script>
</body>
</html>
