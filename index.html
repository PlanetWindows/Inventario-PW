<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario Planet Windows</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style>
<script>
fetch('inventory-full.html').then(r=>r.text()).then(t=>{
  const m=t.match(/<link\s+rel=["']icon["'][^>]*href=["']([^"']+)["'][^>]*>/i) || t.match(/<link[^>]*href=["']([^"']+)["'][^>]*rel=["']icon["'][^>]*>/i);
  if(m){
    const old=document.querySelector('link[rel="icon"]'); if(old) old.remove();
    const l=document.createElement('link'); l.rel='icon'; l.type='image/x-icon'; l.href=m[1]; document.head.appendChild(l);
  }
}).catch(()=>{});
</script>
</head>
<body>
<iframe id="inventory" src="inventory-full.html" title="Inventario Planet Windows"></iframe>
<script>
(function(){
  const f=document.getElementById('inventory');
  function removeExtraDeleteButtons(){
    try{
      const d=f.contentDocument;
      if(!d)return;
      d.querySelectorAll('tr').forEach(function(r){
        const b=r.querySelectorAll('button.delete,button.pw-del,[aria-label="Elimina riga"]');
        for(let i=1;i<b.length;i++)b[i].remove();
      });
    }catch(e){}
  }
  f.addEventListener('load',function(){removeExtraDeleteButtons();setTimeout(removeExtraDeleteButtons,300);setTimeout(removeExtraDeleteButtons,1200)});
})();
</script>
</body>
</html>
